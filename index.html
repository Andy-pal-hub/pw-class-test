const ans=id=>state.answers[id];
const countClass=()=>state.history.filter(id=>!id.startsWith("B")).length;
const getSubtype=()=>ans("P01")==="A"?"Лечение":ans("P01")==="B"?"Контроль":ans("P01")==="C"?"Бафы и дебафы":ans("P01")==="D"?"Урон с поддержкой":ans("Q01")==="D"?"Лечение":"Не уточнено";
const physicalHard=()=>ans("P02")==="A"&&!["B","D"].includes(ans("P03"));
const supportHard=()=>ans("P04")==="A"&&!["A","D"].includes(ans("P03"));
function supportScore(cl){const s=getSubtype();if(s==="Лечение")return v(cl,K.heal);if(s==="Контроль")return v(cl,K.ctrl);if(s==="Бафы и дебафы")return (v(cl,K.buff)+v(cl,K.deb))/2;if(s==="Урон с поддержкой")return Math.min(v(cl,K.dmg),v(cl,K.sup));return v(cl,K.sup)}
function eligible(cl){return(!physicalHard()||v(cl,K.phy)>=4)&&(!supportHard()||supportScore(cl)>=4)}
function qValues(cl){const a=ans("Q01"),b=ans("Q02"),c=ans("Q03"),d=ans("Q04"),type=getSubtype();
let one=a==="A"?.8*v(cl,K.dmg)+.2*v(cl,K.burst):a==="B"?v(cl,K.ctrl):a==="D"?.7*v(cl,K.heal)+.3*v(cl,K.sup):type==="Лечение"?.7*v(cl,K.heal)+.3*v(cl,K.sup):type==="Контроль"?.7*v(cl,K.ctrl)+.3*v(cl,K.sup):type==="Урон с поддержкой"?.5*v(cl,K.dmg)+.5*v(cl,K.sup):.4*v(cl,K.sup)+.3*v(cl,K.buff)+.3*v(cl,K.deb);
let two=b==="A"?v(cl,K.range):b==="B"?v(cl,K.mov):b==="C"?v(cl,K.sur):.4*v(cl,K.complex)+.4*v(cl,K.combo)+.2*v(cl,K.trans);
let three=c==="A"?v(cl,K.phy):c==="B"?v(cl,K.mag):c==="C"?.5*(5-Math.abs(v(cl,K.phy)-4))+.5*(5-Math.abs(v(cl,K.mag)-4)):0;
let four=d==="A"?.65*v(cl,K.solo)+.35*(5-Math.abs(v(cl,K.gear)-1)):d==="B"?.65*v(cl,K.sup)+.35*(5-Math.abs(v(cl,K.gear)-1)):d==="C"?v(cl,K.dmg):0;
return[one,two,three,four]}
function covered(k){const q1=ans("Q01"),q2=ans("Q02"),q4=ans("Q04");switch(k){case 0:return q1==="B";case 1:return q1==="C";case 2:return q2==="C";case 3:return q2==="B";case 4:return q1==="C";case 5:return q2==="A";case 6:return q1==="C"||q1==="D"||q4==="B";case 7:return q1==="A"||q4==="C";case 8:return q4==="A";case 9:return q4==="A"||q4==="B";case 10:return false;case 11:return q1==="D";case 12:return false;case 13:return q1==="A";case 14:return false;default:return q2==="D"}}
function target(k,code){if(!code||code==="D")return null;return k===9?{A:1,B:3,C:5}[code]:{A:5,B:3,C:0}[code]}
function availableU(){return BANK.map((b,k)=>({...b,k})).filter(b=>ans(b.id)===undefined&&!covered(b.k))}
function compute(){if(!CORE.every(q=>ans(q.id)!==undefined))return null;
const w=[1,1,ans("Q03")==="D"?0:1,ans("Q04")==="D"?0:1];
const responded=BANK.map((b,k)=>({...b,k,answer:ans(b.id)})).filter(b=>b.answer!==undefined&&b.answer!=="D");
const denom=w.reduce((a,b)=>a+b,0)+responded.length;
const list=CLASSES.filter(eligible).map(cl=>{const q=qValues(cl);const bankTotal=responded.reduce((sum,b)=>sum+5-Math.abs(v(cl,b.trait)-target(b.k,b.answer)),0);const main=q.reduce((sum,t,i)=>sum+t*w[i],0);return{cl,name:cl.name,score:(main+bankTotal)/denom,main:q,bankTotal}}).sort((a,b)=>b.score-a.score||a.cl.index-b.cl.index);
return{list,denom,w,answeredU:responded.length,leader:list[0]||null,runner:list[1]||null,third:list[2]||null}}
function stress(e){if(!e?.leader)return 0;let total=0,stay=0;for(let j=0;j<5;j++){if(j<4&&e.w[j]===0)continue;if(j===4&&e.answeredU===0)continue;for(const factor of [.75,1.25]){let alt=e.list.map(item=>{const w=e.w.map((x,i)=>j===i?x*factor:x),wb=j===4?factor:1;return{name:item.name,score:(item.main.reduce((s,v,i)=>s+v*w[i],0)+item.bankTotal*wb)/(w.reduce((a,b)=>a+b,0)+e.answeredU*wb)}}).sort((a,b)=>b.score-a.score);total++;if(alt[0].name===e.leader.name&&(!alt[1]||alt[0].score-alt[1].score>1e-9))stay++;}}return total?stay/total:0}
function threatCount(e){if(!e?.leader)return 0;const avail=availableU();const n=countClass();let threats=0;
for(const ch of e.list.slice(1)){
const gains=avail.map(b=>{let t=b.k===9?[1,3,5]:[5,3,0];return Math.max(0,...t.map(x=>Math.abs(v(e.leader.cl,b.trait)-x)-Math.abs(v(ch.cl,b.trait)-x)))}).sort((a,b)=>b-a);
const potential=(gains[0]||0)+(n<=8?(gains[1]||0):0);
const oldMargin=(e.leader.score-ch.score)*e.denom;
if(potential>=oldMargin-1e-9)threats++;
}return threats}
function decideU(e){if(!e?.leader||!e.runner)return null;const inclThird=e.third&&e.leader.score-e.third.score<=.75;const choices=availableU().map(b=>{const nums=[v(e.leader.cl,b.trait),v(e.runner.cl,b.trait),...(inclThird?[v(e.third.cl,b.trait)]:[])];return{...b,dist:Math.max(...nums)-Math.min(...nums)}}).sort((a,b)=>b.dist-a.dist||a.k-b.k);return choices[0]?.dist>0?choices[0]:null}
function outcome(){
if(state.phase==="intro")return{kind:"intro"};
for(let i=0;i<4;i++){const q=CORE[i];if(ans(q.id)===undefined)return{kind:"question",question:q,category:"Классовая диагностика"};if(state.demo&&ans(BEH[i].id)===undefined)return{kind:"question",question:BEH[i],category:"Архетип · демонстрационный вопрос"};}
if(ans("Q01")==="C"&&ans("P01")===undefined)return{kind:"question",question:EXTRA.P01};
if(["C","D"].includes(ans("Q01"))&&ans("P04")===undefined)return{kind:"question",question:EXTRA.P04};
if(ans("Q03")==="A"&&ans("P02")===undefined)return{kind:"question",question:EXTRA.P02};
let e=compute();
if(e.list.length===0){if(ans("P03")===undefined)return{kind:"question",question:EXTRA.P03};return{kind:"result",status:"conflict",e}}
const n=countClass();
if(n>=10)return{kind:"result",status:"limit",e};
const gap=e.runner?e.leader.score-e.runner.score:0;
const unique=e.list.filter(p=>Math.abs(p.score-e.leader.score)<1e-9).length===1;
const coverage=2+(ans("Q03")==="D"?0:1)+(ans("Q04")==="D"?0:1);
const coveredEnough=coverage>=3||(ans("Q03")==="D"&&ans("Q04")==="D");
const robust=stress(e),threats=threatCount(e);
if(n>=4&&e.leader.score>=3.75&&gap>=.5&&robust>=.9&&unique&&coveredEnough&&threats===0)return{kind:"result",status:"sufficient",e,robust,threats};
const next=decideU(e);
if(!next)return{kind:"result",status:"ambiguous",e,robust,threats};
return{kind:"question",question:{id:next.id,category:"Точное уточнение",title:next.title,options:next.options},e,robust,threats};
}

function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function describeClass(cl){const s=cl.scores;let priorities=TRAITS.map((t,i)=>({t,val:s[i+1]})).filter(x=>x.val>=4&&![K.gear,K.complex].includes(x.t));return priorities.slice(0,3).map(x=>x.t.toLowerCase()).join(" · ")}
function explanation(){const pts=[];const q1=ans("Q01"),q2=ans("Q02"),q3=ans("Q03"),q4=ans("Q04");if(q1==="A")pts.push("ориентацию на личный урон");if(q1==="B")pts.push("контроль противников");if(q1==="C")pts.push(getSubtype()==="Лечение"?"поддержку через лечение":getSubtype()==="Контроль"?"контроль в интересах команды":"командную поддержку");if(q1==="D")pts.push("лечение и спасение союзников");if(q2==="A")pts.push("бой на расстоянии");if(q2==="B")pts.push("мобильный бой");if(q2==="C")pts.push("живучесть");if(q2==="D")pts.push("тактическую сложность");if(q3==="A")pts.push("физический урон");if(q3==="B")pts.push("магический урон");if(q3==="C")pts.push("гибридный тип урона");if(q4==="A")pts.push("самостоятельность в PvE");if(q4==="B")pts.push("групповой PvE");if(q4==="C")pts.push("развитие наносимого урона");return pts.join(", ")}
function personality(){const has=BEH.every(q=>ans(q.id)!==undefined);if(!state.demo||!has)return null;const first=BEH[0].tags[ans("B01")],second=BEH[1].tags[ans("B02")],third=BEH[2].tags[ans("B03")],fourth=BEH[3].tags[ans("B04")],adj=({A:"Грозный",B:"Неутомимый",C:"Стильный",D:"Созерцательный"})[ans("B04")];return{label:`${adj} ${first}-${second}`,extra:`Также: ${third}, ${fourth}.`,tags:[first,second,third,fourth]}}
function wordIcon(id){return({Q01:"⚔",Q02:"⟡",Q03:"✦",Q04:"♜",P01:"✧",P02:"⚖",P03:"◆",P04:"♧"})[id]||"✺"}
function introHTML(){const resume=Object.keys(state.answers).length>0;return `<div class="pane intro"><div><div class="eyebrow">Пробуди своё предназначение</div><h1>Твой путь<br><span class="highlight">в Perfect World</span></h1><p class="lead">Тысячи сражений, десятки способов победить — и только твой собственный стиль. Отвечай на вопросы, а адаптивный тест подберёт подходящий класс среди семнадцати.</p><button class="cta" data-action="start">${resume?"Продолжить путешествие":"Начать испытание"}<span aria-hidden="true">→</span></button><div><label class="toggle"><input type="checkbox" id="demoToggle" ${state.demo?"checked":""}> Добавить 4 шуточных вопроса об игровом характере <small>(демо)</small></label><label class="toggle"><input type="checkbox" id="telemetryToggle" ${state.telemetryEnabled?"checked":""}> Разрешаю отправлять обезличенные итоги теста для улучшения вопросов</label><p class="privacy-note">Без имён, почты и IP в данных теста. Текстовые отзывы и обезличенные прохождения после настройки приёмника будут видны в публичном GitHub-репозитории. Не указывай личную информацию. Можно проходить без отправки данных.</p></div><div class="intro-meta"><div><strong>17</strong>классов</div><div><strong>4–10</strong>вопросов о классе</div><div><strong>∞</strong>возможностей пути</div></div></div><div class="orb-stage" aria-hidden="true"><div class="orb-glow"></div><div class="orb-ring"></div><div class="orb-ring r2"></div><div class="orb-core"></div><div class="orbit-word w1">Find your destiny</div><div class="orbit-word w2">✦ &nbsp; 17 destinies &nbsp; ✦</div></div></div>`}
function questionHTML(q){const n=countClass();const beh=q.id.startsWith("B");const progress=Math.round((n/10)*100);let cat=q.category||"Уточнение";let subtitle=beh?"Этот вопрос влияет только на шуточный архетип, а не на выбор класса.":q.sub||"Выбирай то, что тебе действительно интересно. Здесь нет правильных и неправильных ответов.";
const choices=q.options.map(([key,title,desc],i)=>`<button class="option" data-answer="${esc(key)}" data-question="${esc(q.id)}"><span class="option-key">${String.fromCharCode(65+i)}</span><span class="option-text"><strong>${esc(title)}</strong>${desc?`<small>${esc(desc)}</small>`:""}</span><span class="option-arrow" aria-hidden="true">↗</span></button>`).join("");
return `<div class="pane quiz-layout"><section class="q-container"><div class="q-kicker">${esc(cat)} <span style="float:right;opacity:.75">${esc(q.id)}</span></div><h2 class="q-title">${esc(q.title)}</h2><p class="q-sub">${esc(subtitle)}</p><div class="choices">${choices}</div><div class="q-bottom"><button class="icon-btn" data-action="back" ${state.history.length?"":"disabled"}>← Назад</button><div class="hint">Выбор: клавиши 1–4</div></div><div class="issue-widget"><details><summary>✎ Замечание к вопросу <span class="muted">${esc(q.id)}</span></summary><label class="privacy-note" for="issueInput">Что здесь непонятно, некорректно или спорно?</label><textarea id="issueInput" maxlength="1200" placeholder="Например: вариант B неоднозначный…">${esc(PW_TELEMETRY.getDraft(q.id))}</textarea><div class="privacy-note">Отзыв привязывается к ID вопроса и текущему ответу (если он уже есть). Отправка добровольная; опубликованный отзыв будет доступен в репозитории.</div><button class="issue-submit" data-action="sendIssue" data-question="${esc(q.id)}">Отправить отзыв по ${esc(q.id)}</button><div class="note-status" id="issueStatus" aria-live="polite"></div></details></div></section><aside class="progress-rail"><div class="stat-card"><div class="progress-top"><span>Классовый путь</span><span>${n} / 10</span></div><div class="progress-val">${String(n).padStart(2,"0")} <small>шагов</small></div><div class="track"><div style="width:${progress}%"></div></div><div class="small-copy">Максимум 10 классовых вопросов. Шуточные вопросы не входят в лимит.</div></div><div class="stat-card"><div class="aside-label">Дневник героя</div><div class="mini-stat"><span>Классы</span><strong>17</strong></div><div class="mini-stat"><span>Ответов</span><strong>${state.history.length}</strong></div><div class="mini-stat"><span>Тип вопроса</span><strong>${beh?"Характер":"Подбор"}</strong></div><div class="small-copy" style="margin-top:11px">Можно вернуться и изменить любой последний ответ. Расчёт пересчитывается заново.</div></div></aside></div>`}
function resultHTML(view){const e=view.e,top=e.list.slice(0,3),best=e.leader,persona=personality(),isConflict=view.status==="conflict",statusMap={sufficient:["Диагностика завершена","sufficient"],limit:["Предел вопросов","amb"],ambiguous:["Результат неоднозначен","amb"],conflict:["Требования несовместимы","conflict"]};const [label,tone]=statusMap[view.status];const name=best?.name||"Подходящий класс не найден";const winner=best?`<div class="result-hero"><div class="result-art"><div class="result-glyph" aria-hidden="true">${GLYPH[name]||"✦"}</div><div class="art-note">Твоя новая легенда</div></div><div class="result-body"><div class="eyebrow">Обрети свой класс</div><h2>${esc(name)}</h2><p class="result-desc">${esc(describeClass(best.cl))}</p><div class="score-big">${(best.score/5*100).toFixed(1).replace(".",",")}% <small>совпадение предпочтений</small></div><p class="result-desc">Ты выделил ${esc(explanation())}. По текущей матрице этот класс лучше других соответствует полученным ответам.</p>${persona?`<div class="insight"><strong style="color:var(--gold2)">Демонстрационный архетип:</strong><br>${esc(persona.label)}<br><span class="muted">${esc(persona.extra)}</span></div>`:""}</div></div>`:`<div class="result-hero"><div class="result-art"><div class="result-glyph">⚖</div></div><div class="result-body"><div class="eyebrow">Путь не определён</div><h2>Не всё совместимо</h2><p class="result-desc">Ты отметил физический урон и поддержку как обязательные требования, но в текущей матрице нет класса, который одновременно удовлетворяет обоим порогам. Мы не станем выдавать другой класс за соответствующий запросу.</p></div></div>`;
const bars=top.map((x,i)=>`<div class="rank-row"><span>${i+1}. ${esc(x.name)}</span><div class="rank-bar"><i style="width:${Math.max(0,Math.min(100,x.score/5*100))}%"></i></div><b>${Math.round(x.score/5*100)}%</b></div>`).join("");
const explainStatus={sufficient:"Устойчивость проверена изменениями весов и возможными ответами на оставшиеся уточнения. Это не гарантия понравившегося класса.",limit:"Лимит в 10 классовых вопросов достигнут. Лучший кандидат показан с учётом оставшейся неопределённости.",ambiguous:"Полезные уточнения исчерпаны, но данных недостаточно для однозначного результата. Сравни альтернативы.",conflict:"Выбери другие обязательные условия или начни прохождение заново."}[view.status];
return `<div class="pane result"><div class="result-top"><div class="eyebrow">Испытание пройдено</div><span class="status ${tone}">${esc(label)}</span></div>${winner}<div class="result-grid"><div class="result-section"><h3>${isConflict?"Почему результата нет":"Рейтинг и альтернативы"}</h3>${isConflict?`<p class="small-copy">Для обязательного физического урона и выбранного типа поддержки использован порог 4/5. Без явного разрешения конфликта фильтр остаётся строгим.</p>`:bars+`<p class="small-copy">Сравнение основано на твоих ответах, а не на статистической вероятности выбора класса.</p>`}</div><div class="result-section"><h3>Вердикт системы</h3><p class="small-copy">${esc(explainStatus)}</p><div class="mini-stat"><span>Классовых вопросов</span><strong>${countClass()}</strong></div><div class="mini-stat"><span>Возможных классов</span><strong>${e.list.length}</strong></div><div class="mini-stat"><span>Текущая версия</span><strong>v0.3 MVP</strong></div></div></div>${best?`<div class="result-section"><h3>Оцени рекомендацию</h3><p class="small-copy">Для будущей калибровки пригодится честная оценка. После настройки приёмника можно отправить оценку для калибровки; при недоступности она останется в локальной очереди.</p><div class="rating" role="group" aria-label="Оценка от одного до пяти">${[1,2,3,4,5].map(n=>`<button class="star ${state.feedback?.rating>=n?"active":""}" data-rate="${n}" title="${n} из 5" aria-label="${n} из 5">★</button>`).join("")}</div><p class="small-copy">Ты выбрал бы этот класс самостоятельно?</p><div class="chipline">${[["yes","Да"],["maybe","Возможно"],["no","Нет"]].map(([key,label])=>`<button class="ghost" data-expected="${key}" style="${state.feedback?.expected===key?"border-color:#dbba79;color:#f1d7aa":""}">${label}</button>`).join("")}</div><textarea id="feedbackText" placeholder="Что подошло или что алгоритм упустил? (необязательно)">${esc(state.feedback?.text||"")}</textarea><div class="result-actions"><button class="ghost" data-action="saveFeedback">Сохранить и отправить оценку</button></div><div class="feedback-status" id="feedbackStatus"></div></div>`:""}<p class="privacy-note">Данные этого пилота не являются статистически репрезентативными. Передаются только при добровольном согласии или явном нажатии отправки.</p><div class="result-actions"><button class="cta" data-action="restart">Пройти заново ↗</button><button class="ghost" data-action="export">Экспорт прохождения · JSON</button><button class="ghost" data-action="exportQueue">Экспорт очереди отзывов · JSON</button><button class="ghost" data-action="back">← Изменить ответ</button></div></div>`}
const app=document.getElementById("app");let current=null;
function ensureSession(){if(!state.sessionId)state.sessionId=PW_TELEMETRY.newId();}
function runPayload(view){const ev=view.e||compute();return{session_id:state.sessionId,completed_at:new Date().toISOString(),version:"0.4-pilot",answers:state.history.map(id=>({id,choice:ans(id)})),class_question_count:countClass(),total_question_count:state.history.length,status:view.status,leader:ev?.leader?.name||null,alternatives:(ev?.list||[]).slice(0,3).map(x=>({name:x.name,score_percent:Math.round(x.score*200)/10})),feedback:{rating:state.feedback.rating||0,expected:state.feedback.expected||null,text:(state.feedback.text||"").slice(0,1200)},demo:!!state.demo};}
function queueRun(view,force=false){if(!state.telemetryEnabled&&!force)return;ensureSession();const payload=runPayload(view),hash=JSON.stringify({answers:payload.answers,status:payload.status,feedback:payload.feedback});if(!force&&state.reportedHash===hash)return;state.reportedHash=hash;persist();PW_TELEMETRY.send("run",payload).catch(()=>{});}
async function sendQuestionIssue(id){const input=document.getElementById("issueInput"),s=document.getElementById("issueStatus");const message=(input?.value||"").trim();if(!message){if(s)s.textContent="Напиши замечание перед отправкой.";return;}ensureSession();PW_TELEMETRY.saveDraft(id,message);persist();if(s)s.textContent="Отправка…";const e=current?.e||compute();const payload={session_id:state.sessionId,question_id:id,question_type:id.startsWith("B")?"personality":id.startsWith("Q")?"core":id.startsWith("P")?"priority":"adaptive",question_text:current?.question?.title||"",question_index:state.history.length+1,answer_at_feedback:ans(id)||null,comment:message.slice(0,1200),version:"0.4-pilot",candidates:(e?.list||[]).slice(0,3).map(x=>x.name)};try{const result=await PW_TELEMETRY.send("question_feedback",payload);if(s)s.textContent=result.sent?"Отзыв сохранён в репозитории.":"Отзыв сохранён в этом браузере. Приёмник пока не подключён или недоступен; можно выгрузить JSON.";}catch(err){if(s)s.textContent="Отзыв сохранён в локальной очереди. Попробуй отправить позднее.";}}

function render(){let view=outcome();current=view;if(state.phase==="quiz"&&view.kind==="result"){state.phase="result";state.lastResult=view.status;persist();queueMicrotask(()=>queueRun(view));}
if(view.kind==="intro")app.innerHTML=introHTML();else if(view.kind==="question")app.innerHTML=questionHTML(view.question);else app.innerHTML=resultHTML(view);
window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});}
function answer(id,code){if(current?.kind!=="question"||current.question.id!==id)return;const allowed=current.question.options.some(o=>o[0]===code);if(!allowed)return;state.answers[id]=code;state.history.push(id);state.phase="quiz";persist();render()}
function goBack(){if(!state.history.length)return;const last=state.history.pop();delete state.answers[last];state.phase="quiz";state.lastResult=null;persist();render()}
function start(){ensureSession();state.phase="quiz";if(!state.startedAt)state.startedAt=new Date().toISOString();persist();render()}
function restart(){const demo=state.demo,consent=state.telemetryEnabled;state=initial();state.demo=demo;state.telemetryEnabled=consent;ensureSession();state.phase="quiz";state.startedAt=new Date().toISOString();persist();render()}
function exportJSON(){const view=outcome(),ev=view.e||compute(),payload={version:"0.4-pilot",savedAt:new Date().toISOString(),startedAt:state.startedAt,finishedAt:state.phase==="result"?new Date().toISOString():null,offline:!PW_TELEMETRY.configured(),session_id:state.sessionId,question_feedback_drafts:PW_TELEMETRY.getDrafts(),unsent_events:PW_TELEMETRY.getQueue(),answers:state.history.map(id=>({id,choice:state.answers[id]})),status:state.lastResult,leader:ev?.leader?.name??null,alternatives:ev?.list?.slice(0,3).map(x=>({name:x.name,matchPercent:Math.round(x.score/5*1000)/10}))??[],personality:personality(),feedback:state.feedback};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="perfect-world-test-result.json";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),900)}
document.addEventListener("click",e=>{const a=e.target.closest("[data-action]");if(a){e.preventDefault();switch(a.dataset.action){case"start":start();break;case"home":state.phase="intro";persist();render();break;case"back":goBack();break;case"restart":restart();break;case"export":exportJSON();break;case"saveFeedback":{const input=document.getElementById("feedbackText");state.feedback.text=(input?.value||"").slice(0,1200);persist();const s=document.getElementById("feedbackStatus");if(s)s.textContent="Сохраняем отзыв…";queueRun(current,true);if(s)s.textContent=PW_TELEMETRY.configured()?"Отправка запрошена. При недоступности сети отзыв сохранён в очереди.":"Отзыв в локальной очереди: для онлайн-сбора нужен настроенный приёмник.";break}case"sendIssue":sendQuestionIssue(a.dataset.question);break;case"exportQueue":PW_TELEMETRY.exportQueue();break;}return;}
const opt=e.target.closest("[data-answer]");if(opt){answer(opt.dataset.question,opt.dataset.answer);return;}const rate=e.target.closest("[data-rate]");if(rate){const input=document.getElementById("feedbackText");if(input)state.feedback.text=input.value.slice(0,1600);state.feedback.rating=Number(rate.dataset.rate);persist();render();return;}const expected=e.target.closest("[data-expected]");if(expected){const input=document.getElementById("feedbackText");if(input)state.feedback.text=input.value.slice(0,1600);state.feedback.expected=expected.dataset.expected;persist();render();return;}});
document.addEventListener("change",e=>{if(e.target.id==="demoToggle"){state.demo=e.target.checked;persist();}if(e.target.id==="telemetryToggle"){state.telemetryEnabled=e.target.checked;persist();if(state.telemetryEnabled)PW_TELEMETRY.flush().catch(()=>{});else PW_TELEMETRY.withdrawRunConsent();}});
document.addEventListener("input",e=>{if(e.target.id==="issueInput"&&current?.kind==="question")PW_TELEMETRY.saveDraft(current.question.id,e.target.value);});
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;if(current?.kind==="question"&&/^[1-4]$/.test(e.key)){const q=current.question.options[Number(e.key)-1];if(q)answer(current.question.id,q[0]);}if(e.key==="Escape"&&state.history.length)goBack()});
// Procedural background: light points + connections, no images, fonts or network access.
(function sky(){const cvs=document.getElementById("sky"),ctx=cvs.getContext("2d");if(!ctx)return;let stars=[],w=0,h=0,frame=0;const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){w=cvs.width=window.innerWidth*Math.min(devicePixelRatio||1,2);h=cvs.height=window.innerHeight*Math.min(devicePixelRatio||1,2);stars=Array.from({length:Math.min(75,Math.floor(window.innerWidth/17))},()=>({x:Math.random()*w,y:Math.random()*h,r:(.5+Math.random()*1.6)*Math.min(devicePixelRatio||1,2),speed:.1+Math.random()*.36,phase:Math.random()*7}));}
function draw(){ctx.clearRect(0,0,w,h);for(let i=0;i<stars.length;i++){const s=stars[i],alpha=.23+.24*Math.sin(frame*.016+s.phase);ctx.beginPath();ctx.fillStyle=`rgba(239,213,170,${alpha})`;ctx.arc(s.x,s.y,s.r,0,2*Math.PI);ctx.fill();if(!reduced){s.y-=s.speed;if(s.y<0)s.y=h+4;}if(i%7===0){let t=stars[(i+9)%stars.length],dist=Math.hypot(s.x-t.x,s.y-t.y);if(dist<w*.14){ctx.strokeStyle="rgba(204,200,188,.045)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(t.x,t.y);ctx.stroke()}}}frame++;if(!reduced)requestAnimationFrame(draw)};
window.addEventListener("resize",resize);resize();draw();})();
// Exposed only for deterministic local smoke tests; not used by UI.
window.PW_TEST_DEV={MAT,CORE,BANK,BEH,outcome,compute,stress,threatCount,decideU,reset:()=>{state=initial();state.phase="quiz";render()},set:(id,choice)=>{state.answers[id]=choice;state.history.push(id);state.phase="quiz";render()},get:()=>({state,view:outcome()})};
render();
</script>
